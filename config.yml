# ─────────────────────────────────────────────────────────────
#  CONFIGURATION — à modifier avec TES liens
# ─────────────────────────────────────────────────────────────

# Ta ville (sert seulement d'étiquette dans les notifications)
ville: "Ma ville"

# Un texte est considéré comme lié à Pokémon s'il contient un de ces mots
# (accents et majuscules ignorés)
mots_cles: ["pokemon"]

# Si l'un de ces mots apparaît aussi, la notification le signale (30 ans)
mots_cles_30ans: ["30 ans", "30th", "30e anniversaire", "trentieme"]

# Modèle utilisé pour lire les pages de prospectus (nécessite ANTHROPIC_API_KEY)
modele_ia: "claude-haiku-4-5-20251001"
max_pages_ia: 40        # limite de pages lues par prospectus (contrôle le coût)

# ── Produits à surveiller ────────────────────────────────────
# Colle l'adresse EXACTE de la page du produit.
# Pour un stock lié à ton magasin : sur le site de l'enseigne, choisis ton
# magasin, ouvre la page du produit, puis copie l'adresse affichée.
produits:
  - nom: "Exemple - Display 30 ans"
    enseigne: "Boutique exemple"
    url: "https://www.example.com/produit-pokemon-30-ans"
    # Optionnel : ajuster si le site utilise d'autres formulations
    # marqueurs_rupture: ["rupture de stock", "indisponible"]
    # marqueurs_dispo: ["ajouter au panier"]

# ── Prospectus à lire ────────────────────────────────────────
# Adresse directe d'un PDF, d'une image, ou d'une page web de prospectus
# de ton magasin. Chaque nouvelle version est analysée une seule fois.
prospectus:
  - nom: "Exemple - Prospectus du magasin"
    url: "https://www.example.com/prospectus.pdf"
