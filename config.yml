# ─────────────────────────────────────────────────────────────
#  CONFIGURATION — Alertes Pokémon 30 ans
# ─────────────────────────────────────────────────────────────

ville: "Villefranche-sur-Saône"   # sert d'étiquette dans les notifications
bilan_quotidien: true             # 1 notification par jour (dès 8 h) : « la surveillance tourne » + état des sources

# Un texte est lié à Pokémon s'il contient un de ces mots (accents/majuscules ignorés)
mots_cles: ["pokemon"]

# Mots qui signalent le 30e anniversaire dans un prospectus
mots_cles_30ans: ["30 ans", "30th", "30e anniversaire", "trentieme"]

# Mots qui signalent un produit 30 ans dans une page de collection (nom ou adresse du lien)
mots_cles_collections: ["30 ans", "30th", "30e", "30eme", "anniversaire", "celebration"]

# Lecture des prospectus en images par IA (nécessite le secret ANTHROPIC_API_KEY)
modele_ia: "claude-haiku-4-5-20251001"
max_pages_ia: 40                # limite de pages lues par prospectus (contrôle le coût)
max_produits_par_page: 40       # limite de produits vérifiés par page de collection

# ── 1) PAGES DE COLLECTION ───────────────────────────────────
# Une adresse par enseigne : la page qui liste les produits Pokémon 30 ans.
# Le script te prévient : d'un NOUVEAU produit 30 ans, et d'un retour EN STOCK.
# Comment trouver l'adresse : sur le site de l'enseigne, cherche « Pokémon 30 ans »,
# ouvre la page de résultats ou de collection, copie l'adresse de la barre du navigateur.
# « deja_pokemon: true » = la page ne contient que du Pokémon (les noms des produits
# peuvent alors ne pas contenir le mot « Pokémon »).
collections:
  # Adresses trouvées et vérifiées (pages qui listent des produits Pokémon)
  - nom: "La Grande Récré"
    url: "https://www.lagranderecre.fr/evenements/30-ans-pokemon.html"
    deja_pokemon: true
  - nom: "E.Leclerc (cartes Pokémon)"
    url: "https://www.e.leclerc/cat/cartes-pokemon"
    deja_pokemon: true
  - nom: "Auchan (marque Pokémon)"
    url: "https://www.auchan.fr/marques/pokemon/ca-55409"
    deja_pokemon: true

  # ⚠️ ESSAIS : adresses de recherche « pokemon 30 ans » NON vérifiées.
  # Si une enseigne échoue, tu reçois une alerte « page illisible » : cherche alors
  # « Pokémon 30 ans » sur son site, copie l'adresse de la barre du navigateur
  # et remplace la ligne url.
  - nom: "King Jouet"
    url: "https://www.king-jouet.com/jeux-jouets/recherche.htm?q=pokemon+30+ans"
  - nom: "JouéClub"
    url: "https://www.joueclub.fr/catalogsearch/result/?q=pokemon+30+ans"
  - nom: "Micromania"
    url: "https://www.micromania.fr/search?q=pokemon+30+ans"
  - nom: "Cultura"
    url: "https://www.cultura.com/search/results?search_query=pokemon+30+ans"
  - nom: "Fnac"
    url: "https://www.fnac.com/SearchResult/ResultList.aspx?Search=pokemon+30+ans"
  - nom: "Carrefour"
    url: "https://www.carrefour.fr/s?q=pokemon+30+ans"
  - nom: "Intermarché"
    url: "https://www.intermarche.com/recherche/pokemon%2030%20ans"
  - nom: "Super U"
    url: "https://www.coursesu.com/recherche?q=pokemon+30+ans"

# ── 2) PRODUITS PRÉCIS (facultatif) ──────────────────────────
# Pour suivre une page produit en particulier (une ligne par produit).
produits: []
  # - nom: "Coffret Dresseur d'Élite 30e Anniversaire"
  #   enseigne: "King Jouet"
  #   url: "ADRESSE EXACTE DE LA PAGE DU PRODUIT"

# ── 3) PROSPECTUS ────────────────────────────────────────────
# Adresse d'un PDF, d'une image (lus page par page avec l'IA) ou d'une page web
# (le texte est lu, une alerte n'est envoyée que si les phrases Pokémon changent).
# Pages web trouvées : elles listent les offres/titres des catalogues, PAS les pages
# intérieures des prospectus. Pour lire l'intérieur d'un prospectus, colle l'adresse
# de son PDF (ou de l'image d'une page) : ça change chaque semaine.
prospectus:
  - nom: "Auchan - catalogue (offre Pokémon 30 ans)"
    url: "https://www.123catalogue.fr/catalogue/auchan/coffret-journee-pokemon-30ans-604073"
  - nom: "Intermarché Villefranche - catalogues"
    url: "https://www.bonial.fr/Villefranche-sur-Saone/Intermarche/p-r3"
  # - nom: "Prospectus Carrefour de la semaine"
  #   url: "ADRESSE DU PDF"

# ── 4) VEILLE : sources FIABLES sur les restocks près de chez toi et à venir ──
# Philosophie : peu de sources, bien choisies, et un filtre strict. Tu n'es alerté que si un
# nouveau texte parle de Pokémon ET d'un mouvement de stock (restock, réassort, arrivage,
# dispo…) ou d'une sortie à venir (prochaine vague, précommande, date décalée…) ET, en plus,
# cite l'un de ces éléments :
#   📍 une commune de ta zone (liste « proche » / « large » ci-dessous)
#   🏪 une enseigne de ta liste « enseignes » (celles qui ont des magasins près de toi)
#   🔮 une annonce À VENIR (prochain restock, précommande, sortie décalée…)
# Tout le reste (restock américain, vente en ligne, discussions…) est ignoré.
# Au 1er passage d'une source, le script mémorise l'existant sans rien envoyer, puis envoie
# un seul message « Veille activée ». Même info vue sur 2 sources = une seule alerte.
zone:
  proche:
    - "Villefranche"
    - "Villefranche-sur-Saône"
    - "Limas"
    - "Gleizé"
    - "Arnas"
    - "Jassans"
    - "Jassans-Riottier"
    - "Anse"
    - "Saint-Georges-de-Reneins"
    - "Belleville"
    - "Belleville-en-Beaujolais"
    - "Trévoux"
    - "Reyrieux"
    - "Neuville-sur-Saône"
    - "Genay"
    - "Montmerle"
    - "Thoissey"
    - "Tarare"
    - "Chazay-d'Azergues"
    - "Lozanne"
    - "Quincieux"
    - "Beaujolais"
    - "69400"
    - "69480"
    - "69220"
    - "69640"
    - "69170"
    - "69380"
    - "01480"
    - "01600"
  large:
    - "Lyon"
    - "Rhône"
    - "Auvergne-Rhône-Alpes"
    - "Beynost"
    - "Dombes"
    - "Villars-les-Dombes"
    - "Bourg-en-Bresse"
    - "Mâcon"
  # Enseignes qui ont des magasins dans ta région. Les vendeurs 100 % en ligne (Amazon,
  # Cdiscount, Pokémon Center…) n'y sont volontairement pas : ils ne t'intéressent pas ici.
  enseignes:
    - "Leclerc"
    - "E.Leclerc"
    - "Auchan"
    - "Carrefour"
    - "Intermarché"
    - "Super U"
    - "Hyper U"
    - "Cultura"
    - "Fnac"
    - "King Jouet"
    - "JouéClub"
    - "La Grande Récré"
    - "Micromania"
    - "Maison de la Presse"
    - "tabac"
    - "tabacs"
    - "buraliste"

# Réglages communs (tous facultatifs) :
veille_options:
  ciblage: true                 # false = alerter sur tout post de stock Pokémon (beaucoup plus de bruit)
  max_notifs_par_source: 3      # au-delà, un seul message groupé « N autres alertes »
  intervalle_min: 10            # minutes minimum entre deux lectures d'une même source
  zone_stricte: false           # true = n'alerter QUE les posts qui citent une commune de ta zone
  # mots_restock: [...]         # mots de « stock qui bouge » (début de mot suffit)
  # mots_futur: [...]           # mots de « restock / sortie à venir »
  # mots_exclus: [...]          # un post contenant un de ces mots entier est ignoré
  #                             # (par défaut : vends, wts, wtb, echange, recherche, cherche…)
#
# Réglages possibles par source : deja_pokemon: true (la source ne parle que de Pokémon),
# exiger_restock: false, ciblage: false, zone_stricte, intervalle_min, priorite (1 à 5).
#
# ⚠️ Ces adresses n'ont pas pu être lues depuis ton dépôt : je les ai trouvées par recherche.
# Teste-les : Actions → Surveillance Pokémon → Run workflow → coche « Diagnostic ».
# Tu reçois sur ton téléphone la liste des sources qui marchent (✓) et de celles qui échouent (✗).
veille:
  # — Suivi des restocks 30 ans, avec les arrivages en magasin signalés par la communauté
  #   (tabacs, maisons de la presse, grandes surfaces). Page mise à jour régulièrement. —
  - nom: "PokéDrop - restocks Pokémon 30 ans"
    type: page
    url: "https://pokedrop.fr/restock-pokemon-30-ans/"
    deja_pokemon: true

  # — Calendrier officiel : prochaines vagues de sortie (30 oct : decks ; 6 nov : Ultra-Premium…).
  #   Pokécardex est LA référence française des cartes ; ce sujet est mis à jour quand une date
  #   change (ex. une sortie décalée). —
  - nom: "Pokécardex - calendrier des produits 30e Anniversaire"
    type: page
    url: "https://www.pokecardex.com/forums/viewtopic.php?t=50316"
    deja_pokemon: true
    intervalle_min: 30

  # — Dealabs : fil de la communauté « disponibilités et réassorts Pokémon TCG ».
  #   (Les commentaires se chargent peut-être en JavaScript : le diagnostic te dira ce qui est lu.) —
  - nom: "Dealabs - fil réassorts Pokémon TCG"
    type: page
    url: "https://www.dealabs.com/discussions/pokemon-tcg-disponibilites-et-reassorts-des-cartes-pokemon-boosters-etb-coffrets-3337943"
    deja_pokemon: true
    intervalle_min: 10

  # — Presse locale (secteur Villefranche / Beaujolais), via Google Actualités.
  #   Rare mais fiable : n'alerte que si l'article cite ta zone. —
  - nom: "Presse locale - Pokémon Villefranche / Beaujolais"
    type: rss
    url: "https://news.google.com/rss/search?q=pokemon+cartes+(Villefranche-sur-Sa%C3%B4ne+OR+Beaujolais)+when:30d&hl=fr&gl=FR&ceid=FR:fr"
    exiger_restock: false
    zone_stricte: true
    intervalle_min: 30

  # ── Désactivées volontairement (trop de bruit ou pas assez fiables) ──
  # Reddit : retiré, il envoyait des posts hors sujet (restocks américains, etc.).
  # X / Pikacheck : lecture non officielle de X, fiabilité non démontrée. À réactiver si tu veux :
  # - nom: "X - Pikacheck (alertes restock)"
  #   type: x
  #   compte: "PikaCheck"
  #   deja_pokemon: true
  #
  # Telegram : si tu trouves un canal de restock FR fiable, copie ce modèle.
  #   (https://t.me/s/NOM_DU_CANAL doit afficher les messages dans un navigateur.)
  # - nom: "Telegram - NOM DU CANAL"
  #   type: telegram
  #   canal: "nom_du_canal"
  #   deja_pokemon: true
