# ─────────────────────────────────────────────────────────────
#  CONFIGURATION — Alertes Pokémon 30 ans
# ─────────────────────────────────────────────────────────────

ville: "Villefranche-sur-Saône"   # sert d'étiquette dans les notifications

# Un texte est lié à Pokémon s'il contient un de ces mots (accents/majuscules ignorés)
mots_cles: ["pokemon"]

# Mots qui signalent le 30e anniversaire dans un prospectus
mots_cles_30ans: ["30 ans", "30th", "30e anniversaire", "trentieme"]

# Mots qui signalent un produit 30 ans dans une page de collection (nom ou adresse du lien)
mots_cles_collections: ["30 ans", "30th", "30e", "30eme", "anniversaire", "celebration"]

# Lecture des prospectus en images par IA (nécessite le secret ANTHROPIC_API_KEY)
modele_ia: "claude-haiku-4-5-20251001"
max_pages_ia: 40                # limite de pages lues par prospectus (contrôle le coût)
max_produits_par_page: 40       # limite de produits vérifiés par page de collection

# ── 1) PAGES DE COLLECTION ───────────────────────────────────
# Une adresse par enseigne : la page qui liste les produits Pokémon 30 ans.
# Le script te prévient : d'un NOUVEAU produit 30 ans, et d'un retour EN STOCK.
# Comment trouver l'adresse : sur le site de l'enseigne, cherche « Pokémon 30 ans »,
# ouvre la page de résultats ou de collection, copie l'adresse de la barre du navigateur.
# « deja_pokemon: true » = la page ne contient que du Pokémon (les noms des produits
# peuvent alors ne pas contenir le mot « Pokémon »).
collections:
  # Adresses trouvées et vérifiées (pages qui listent des produits Pokémon)
  - nom: "La Grande Récré"
    url: "https://www.lagranderecre.fr/evenements/30-ans-pokemon.html"
    deja_pokemon: true
  - nom: "E.Leclerc (cartes Pokémon)"
    url: "https://www.e.leclerc/cat/cartes-pokemon"
    deja_pokemon: true
  - nom: "Auchan (marque Pokémon)"
    url: "https://www.auchan.fr/marques/pokemon/ca-55409"
    deja_pokemon: true

  # ⚠️ ESSAIS : adresses de recherche « pokemon 30 ans » NON vérifiées.
  # Si une enseigne échoue, tu reçois une alerte « page illisible » : cherche alors
  # « Pokémon 30 ans » sur son site, copie l'adresse de la barre du navigateur
  # et remplace la ligne url.
  - nom: "King Jouet"
    url: "https://www.king-jouet.com/jeux-jouets/recherche.htm?q=pokemon+30+ans"
  - nom: "JouéClub"
    url: "https://www.joueclub.fr/catalogsearch/result/?q=pokemon+30+ans"
  - nom: "Micromania"
    url: "https://www.micromania.fr/search?q=pokemon+30+ans"
  - nom: "Cultura"
    url: "https://www.cultura.com/search/results?search_query=pokemon+30+ans"
  - nom: "Fnac"
    url: "https://www.fnac.com/SearchResult/ResultList.aspx?Search=pokemon+30+ans"
  - nom: "Carrefour"
    url: "https://www.carrefour.fr/s?q=pokemon+30+ans"
  - nom: "Intermarché"
    url: "https://www.intermarche.com/recherche/pokemon%2030%20ans"
  - nom: "Super U"
    url: "https://www.coursesu.com/recherche?q=pokemon+30+ans"

# ── 2) PRODUITS PRÉCIS (facultatif) ──────────────────────────
# Pour suivre une page produit en particulier (une ligne par produit).
produits: []
  # - nom: "Coffret Dresseur d'Élite 30e Anniversaire"
  #   enseigne: "King Jouet"
  #   url: "ADRESSE EXACTE DE LA PAGE DU PRODUIT"

# ── 3) PROSPECTUS ────────────────────────────────────────────
# Adresse d'un PDF, d'une image (lus page par page avec l'IA) ou d'une page web
# (le texte est lu, une alerte n'est envoyée que si les phrases Pokémon changent).
# Pages web trouvées : elles listent les offres/titres des catalogues, PAS les pages
# intérieures des prospectus. Pour lire l'intérieur d'un prospectus, colle l'adresse
# de son PDF (ou de l'image d'une page) : ça change chaque semaine.
prospectus:
  - nom: "Auchan - catalogue (offre Pokémon 30 ans)"
    url: "https://www.123catalogue.fr/catalogue/auchan/coffret-journee-pokemon-30ans-604073"
  - nom: "Intermarché Villefranche - catalogues"
    url: "https://www.bonial.fr/Villefranche-sur-Saone/Intermarche/p-r3"
  # - nom: "Prospectus Carrefour de la semaine"
  #   url: "ADRESSE DU PDF"

# ── 4) VEILLE COMMUNAUTAIRE : internet, forums, réseaux sociaux ──
# Le script lit ces sources en continu et te notifie quand un NOUVEAU post parle d'un
# restock / réassort / retour en stock Pokémon (tabacs et maisons de la presse compris).
# Au tout premier passage d'une source, il mémorise l'existant sans rien envoyer, puis te
# prévient d'un seul message « Veille activée ». Même info vue sur plusieurs sources = une
# seule alerte.
#
# 📍 ZONE : un post qui cite une de ces communes (ou un de ces codes postaux) reçoit un 📍,
# la priorité maximale, et passe en premier. « large » = priorité haute sans être max.
# Un post sans lieu (restock en ligne, par exemple) est alerté normalement, sauf si tu mets
# zone_stricte: true plus bas (alors SEULS les posts qui citent un lieu ci-dessous passent).
zone:
  proche:
    - "Villefranche"
    - "Villefranche-sur-Saône"
    - "Limas"
    - "Gleizé"
    - "Arnas"
    - "Jassans"
    - "Jassans-Riottier"
    - "Anse"
    - "Saint-Georges-de-Reneins"
    - "Belleville"
    - "Belleville-en-Beaujolais"
    - "Trévoux"
    - "Reyrieux"
    - "Neuville-sur-Saône"
    - "Genay"
    - "Montmerle"
    - "Thoissey"
    - "Tarare"
    - "Chazay-d'Azergues"
    - "Lozanne"
    - "Quincieux"
    - "Beaujolais"
    - "69400"
    - "69480"
    - "69220"
    - "69640"
    - "69170"
    - "69380"
    - "01480"
    - "01600"
  large:
    - "Lyon"
    - "Rhône"
    - "Auvergne-Rhône-Alpes"
    - "Beynost"
    - "Dombes"
    - "Villars-les-Dombes"
    - "Bourg-en-Bresse"
    - "Mâcon"

# Réglages communs (tous facultatifs) :
veille_options:
  max_notifs_par_source: 3      # au-delà, un seul message groupé « N autres alertes »
  intervalle_min: 3             # minutes minimum entre deux lectures d'une même source
  zone_stricte: false           # true = n'alerter QUE les posts qui citent un lieu de « zone »
  # mots_restock: [...]         # un post doit contenir un de ces mots (début de mot suffit)
  # mots_exclus: [...]          # un post contenant un de ces mots entier est ignoré
  #                             # (par défaut : vends, wts, wtb, echange, recherche, cherche…)
#
# Réglages possibles par source : deja_pokemon: true (la source ne parle que de Pokémon),
# exiger_restock: false (alerter sur TOUT post Pokémon, utile pour un canal dédié aux restocks),
# zone_stricte: true/false, intervalle_min, priorite (1 à 5), mots_restock / mots_exclus.
#
# ⚠️ Beaucoup de ces adresses n'ont pas pu être testées. Lance le diagnostic :
#       python watcher.py --veille-test
# Il affiche, source par source, ce qui est lu et ce qui déclencherait une alerte
# (✅ = alerte, 📍 = zone proche, 🔥 = 30 ans), sans notification ni sauvegarde.
# Une source en panne 3 lectures de suite te envoie une alerte « source illisible ».
veille:
  # — Communautés / influenceurs français qui lancent des alertes restock —
  # Pikacheck (boutique + alertes gratuites sur X et Discord). Lecture de X = méthode non
  # officielle, EXPÉRIMENTALE : si le diagnostic dit « aucun tweet lisible », supprime ce bloc.
  - nom: "X - Pikacheck (alertes restock)"
    type: x
    compte: "PikaCheck"
    deja_pokemon: true
    intervalle_min: 5

  # Dealabs : fil de la communauté « disponibilités et réassorts Pokémon TCG »
  # (la page existe ; la lecture de ses commentaires reste incertaine : ils se chargent
  #  sans doute en JavaScript. Dealabs a aussi une fonction « Créer une alerte » dans son
  #  appli : active-la sur le mot « pokémon » en complément.)
  - nom: "Dealabs - fil réassorts Pokémon TCG"
    type: page
    url: "https://www.dealabs.com/discussions/pokemon-tcg-disponibilites-et-reassorts-des-cartes-pokemon-boosters-etb-coffrets-3337943"
    deja_pokemon: true
    intervalle_min: 10

  # Reddit (flux RSS de recherche). Un seul flux : Reddit refuse (erreur 429) deux requêtes de suite.
  - nom: "Reddit - r/PokemonTCG restock"
    type: rss
    url: "https://www.reddit.com/r/PokemonTCG/search.rss?q=restock+OR+%22back+in+stock%22&restrict_sr=on&sort=new&t=day"
    deja_pokemon: true
    intervalle_min: 15

  # — Internet en général : presse, blogs, sites spécialisés (via Google Actualités) —
  - nom: "Web - restocks Pokémon (Google Actualités)"
    type: rss
    url: "https://news.google.com/rss/search?q=pokemon+(restock+OR+r%C3%A9assort+OR+%22retour+en+stock%22)+when:7d&hl=fr&gl=FR&ceid=FR:fr"
    intervalle_min: 8
  - nom: "Web - Pokémon 30 ans (Google Actualités)"
    type: rss
    url: "https://news.google.com/rss/search?q=pokemon+%2230+ans%22+(cartes+OR+coffret+OR+display)+when:1d&hl=fr&gl=FR&ceid=FR:fr"
    intervalle_min: 8

  # — Local : presse du secteur et tabacs —
  # Les tabacs n'ont pas de site à surveiller : on ne les repère que par les posts
  # des communautés et par la presse locale (Le Progrès, etc.).
  - nom: "Local - Pokémon cartes Villefranche / Beaujolais"
    type: rss
    url: "https://news.google.com/rss/search?q=pokemon+cartes+(Villefranche-sur-Sa%C3%B4ne+OR+Beaujolais)+when:30d&hl=fr&gl=FR&ceid=FR:fr"
    exiger_restock: false
    intervalle_min: 15
  - nom: "Tabacs - cartes Pokémon (Google Actualités)"
    type: rss
    url: "https://news.google.com/rss/search?q=pokemon+tabac+(cartes+OR+boosters+OR+coffrets)+when:7d&hl=fr&gl=FR&ceid=FR:fr"
    exiger_restock: false
    intervalle_min: 15

  # — Telegram : canaux PUBLICS d'alertes restock. Je n'ai pas pu en vérifier de fiables :
  #   trouve ceux qui t'intéressent (cherche « restock pokemon » dans Telegram), puis note le
  #   nom après t.me/ . Il faut que https://t.me/s/NOM_DU_CANAL affiche les messages dans un
  #   navigateur, sinon le script ne peut pas le lire. —
  # - nom: "Telegram - NOM DU CANAL"
  #   type: telegram
  #   canal: "nom_du_canal"
  #   deja_pokemon: true
  #   exiger_restock: false      # un canal dédié aux restocks : on alerte sur tous ses posts
  #   intervalle_min: 4

  # — Autre compte X (même méthode expérimentale que Pikacheck) —
  # - nom: "X - NOM DU COMPTE"
  #   type: x
  #   compte: "pseudo_sans_arobase"
  #   deja_pokemon: true

  # — Bluesky : chaque compte a un flux RSS —
  # - nom: "Bluesky - NOM DU COMPTE"
  #   type: rss
  #   url: "https://bsky.app/profile/pseudo.bsky.social/rss"
